<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste do microfone</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#f6f4ef;color:#1d2142}button{display:block;width:100%;padding:14px;margin:8px 0;border-radius:14px;border:1px solid #c9c9d6;background:#fff;font-size:16px}pre{white-space:pre-wrap;background:#fff;border-radius:12px;padding:12px;font-size:13px}h1{font-size:20px}</style></head><body>
<h1>Teste do microfone</h1><p id="w" style="display:none;background:#fff3cd;border-radius:12px;padding:12px"><b>Atenção:</b> você abriu dentro de outro app (como o app Claude), que bloqueia o microfone. Copie o endereço e abra no app <b>Safari</b>.</p><p>Toque em cada botão, na ordem, e depois em “Mostrar relatório”. Tire um print do relatório e envie.</p>
<button id="a">1) Pedir microfone (simples)</button><button id="b">2) Pedir microfone (com filtros)</button><button id="c">3) Microfone + Web Audio (2 s)</button><button id="d">4) Gravar 3 s com MediaRecorder</button><button id="e">Mostrar relatório</button><pre id="o">Aguardando…</pre>
<script>
var log=[];function L(t){log.push(t);document.getElementById("o").textContent=log.join("\n")}
function err(e){return (e&&e.name||"erro")+": "+(e&&e.message||"")}
function info(){var m="";try{m=matchMedia("(display-mode: standalone)").matches}catch(x){}
L("== info ==");L("UA: "+navigator.userAgent);L("seguro(HTTPS): "+isSecureContext);L("visibilidade: "+document.visibilityState+" · foco: "+document.hasFocus());L("tela inicial (standalone): "+(navigator.standalone===true||m));L("em iframe: "+(window.top!==window));L("mediaDevices: "+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));L("MediaRecorder: "+(typeof MediaRecorder)+" · mp4: "+(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/mp4")));
if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:"microphone"}).then(function(p){L("permissão do microfone: "+p.state)}).catch(function(e){L("permissão: n/d ("+err(e)+")")})}else L("permissão: API indisponível")}
info();if(/Claude\//.test(navigator.userAgent)||window.top!==window)document.getElementById("w").style.display="block";
function gum(c,label,after){L("→ "+label);navigator.mediaDevices.getUserMedia(c).then(function(s){var t=s.getAudioTracks()[0];L("OK "+label+" · trilha: "+(t&&t.label)+" · estado "+(t&&t.readyState)+" · mudo "+(t&&t.muted));if(after)after(s);else s.getTracks().forEach(function(x){x.stop()})}).catch(function(e){L("FALHOU "+label+" → "+err(e))})}
document.getElementById("a").onclick=function(){gum({audio:true},"getUserMedia simples")};
document.getElementById("b").onclick=function(){gum({audio:{echoCancellation:true,noiseSuppression:true}},"getUserMedia com filtros")};
document.getElementById("c").onclick=function(){gum({audio:true},"microfone + Web Audio",function(s){try{var AC=window.AudioContext||window.webkitAudioContext,x=new AC();x.resume&&x.resume();var src=x.createMediaStreamSource(s),p=x.createScriptProcessor(4096,1,1),n=0;p.onaudioprocess=function(e){n+=e.inputBuffer.length};src.connect(p);p.connect(x.destination);L("Web Audio gravando…");setTimeout(function(){p.disconnect();src.disconnect();x.close();s.getTracks().forEach(function(t){t.stop()});L("Web Audio OK · amostras capturadas: "+n+" · taxa "+x.sampleRate)},2000)}catch(e){L("FALHOU Web Audio → "+err(e));s.getTracks().forEach(function(t){t.stop()})}})};
document.getElementById("d").onclick=function(){gum({audio:true},"microfone + MediaRecorder",function(s){try{var mt=(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");var r=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s),ch=[];r.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};r.onstop=function(){s.getTracks().forEach(function(t){t.stop()});var sz=ch.reduce(function(a,b){return a+b.size},0);L("MediaRecorder OK · bytes: "+sz+" · tipo "+(r.mimeType||mt))};r.onerror=function(e){L("erro do gravador: "+err(e.error))};r.start();L("gravando 3 s (estado "+r.state+")…");setTimeout(function(){r.stop()},3000)}catch(e){L("FALHOU MediaRecorder → "+err(e));s.getTracks().forEach(function(t){t.stop()})}})};
document.getElementById("e").onclick=function(){document.getElementById("o").textContent=log.join("\n");window.scrollTo(0,document.body.scrollHeight)};
</script><p style="font-size:12px;color:#666">Desenvolvido por Leandro Muniz</p></body></html>
